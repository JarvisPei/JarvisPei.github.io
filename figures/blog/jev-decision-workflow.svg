<svg xmlns="http://www.w3.org/2000/svg" width="960" height="430" viewBox="0 0 960 430" role="img" aria-labelledby="title desc">
  <title id="title">A fast decision is only part of the workflow</title>
  <desc id="desc">A request and evidence enter a decision model. The application can use its answer as a shortcut or defer to the main LLM. Both paths lead to a task outcome. Any needed repair or recheck returns to the observed state and must be counted in the total work. Paths are schematic, not measured durations.</desc>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#20252b" /></marker></defs>
  <rect width="960" height="430" fill="#fff" />
  <g font-family="Arial, Helvetica, sans-serif" fill="#20252b">
    <g stroke="#20252b" stroke-width="2">
      <rect x="30" y="167" width="190" height="96" rx="8" fill="#eaf0f9" />
      <rect x="280" y="167" width="160" height="96" rx="8" fill="#fff0e4" />
      <rect x="555" y="60" width="175" height="80" rx="8" fill="#f0f2f5" />
      <rect x="555" y="270" width="175" height="80" rx="8" fill="#eaf0f9" />
      <rect x="810" y="167" width="120" height="96" rx="8" fill="#fff" />
    </g>
    <g text-anchor="middle" font-size="21" font-weight="700">
      <text x="125" y="204">Request +</text><text x="125" y="234">evidence</text>
      <text x="360" y="223">Decision</text>
      <text x="642" y="108">Use decision</text>
      <text x="642" y="318">Main LLM</text>
      <text x="870" y="204">Task</text><text x="870" y="234">outcome</text>
    </g>
    <g stroke="#20252b" stroke-width="2.3" fill="none">
      <path d="M232 215H267" marker-end="url(#arrow)" />
      <path d="M452 215H490" />
      <path d="M490 215V100H542" marker-end="url(#arrow)" />
      <path d="M490 215V310H542" marker-end="url(#arrow)" />
      <path d="M742 100H770V215" />
      <path d="M742 310H770V215" />
      <path d="M770 215H797" marker-end="url(#arrow)" />
    </g>
    <circle cx="490" cy="215" r="3.5" fill="#20252b" />
    <circle cx="770" cy="215" r="3.5" fill="#20252b" />
    <g text-anchor="middle" font-size="19">
      <text x="490" y="78">Shortcut</text>
      <text x="490" y="345">Fallback</text>
    </g>
    <path d="M870 275V390H125V275" stroke="#20252b" stroke-width="2.1" stroke-dasharray="6 5" fill="none" marker-end="url(#arrow)" />
    <text x="480" y="378" text-anchor="middle" font-size="19">Repair / recheck, if needed</text>
  </g>
</svg>
