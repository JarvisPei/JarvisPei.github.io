<svg xmlns="http://www.w3.org/2000/svg" width="960" height="400" viewBox="0 0 960 400" role="img" aria-labelledby="title desc">
  <title id="title">Repeated state processing and shared state processing</title>
  <desc id="desc">Three questions can each repeat state processing or branch from state processed once. The latter is an execution optimization whose copying and scheduling costs still matter.</desc>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#20252b" /></marker></defs>
  <rect width="960" height="400" fill="#fff" />
  <g font-family="Arial, Helvetica, sans-serif" fill="#20252b">
    <text x="45" y="48" font-size="23" font-weight="700">Repeat the state</text>
    <text x="530" y="48" font-size="23" font-weight="700">Share the state</text>
    <path d="M482 35V360" stroke="#d8dce2" stroke-width="2" />
    <g stroke="#20252b" stroke-width="1.8">
      <rect x="45" y="100" width="225" height="46" rx="5" fill="#eaf0f9" />
      <rect x="45" y="184" width="225" height="46" rx="5" fill="#eaf0f9" />
      <rect x="45" y="268" width="225" height="46" rx="5" fill="#eaf0f9" />
      <rect x="282" y="100" width="64" height="46" rx="5" fill="#fff0e4" />
      <rect x="282" y="184" width="64" height="46" rx="5" fill="#fff0e4" />
      <rect x="282" y="268" width="64" height="46" rx="5" fill="#fff0e4" />
      <rect x="530" y="171" width="191" height="72" rx="7" fill="#eaf0f9" />
      <rect x="793" y="100" width="64" height="46" rx="5" fill="#fff0e4" />
      <rect x="793" y="184" width="64" height="46" rx="5" fill="#fff0e4" />
      <rect x="793" y="268" width="64" height="46" rx="5" fill="#fff0e4" />
    </g>
    <g text-anchor="middle" font-size="21">
      <text x="157" y="130">state</text><text x="157" y="214">state</text><text x="157" y="298">state</text>
      <text x="314" y="130">q₁</text><text x="314" y="214">q₂</text><text x="314" y="298">q₃</text>
      <text x="625" y="214">state once</text>
      <text x="825" y="130">q₁</text><text x="825" y="214">q₂</text><text x="825" y="298">q₃</text>
      <text x="422" y="130">p₁</text><text x="422" y="214">p₂</text><text x="422" y="298">p₃</text>
      <text x="926" y="130">p₁</text><text x="926" y="214">p₂</text><text x="926" y="298">p₃</text>
    </g>
    <g stroke="#20252b" stroke-width="2.1" fill="none" marker-end="url(#arrow)">
      <path d="M359 123H398" /><path d="M359 207H398" /><path d="M359 291H398" />
      <path d="M753 123H780" /><path d="M753 207H780" /><path d="M753 291H780" />
      <path d="M870 123H903" /><path d="M870 207H903" /><path d="M870 291H903" />
    </g>
    <path d="M721 207H753M753 123V291" stroke="#20252b" stroke-width="2.1" fill="none" />
    <text x="45" y="367" font-size="18">Three required answers, three state reads.</text>
    <text x="530" y="367" font-size="18">Reuse is a runtime capability, not an API label.</text>
  </g>
</svg>
